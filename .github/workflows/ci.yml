name: My first pipeline

on: push
    
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Build image
        run: |
            docker build -t ${{ secrets.DOCKER_USERNAME }}/portfolio-app:${{ github.run_number }} .
            docker build -t ${{ secrets.DOCKER_USERNAME }}/portfolio-app .
      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push image to registry
        run: |
         docker push ${{ secrets.DOCKER_USERNAME }}/portfolio-app
         docker push ${{ secrets.DOCKER_USERNAME }}/portfolio-app:${{ github.run_number }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH to server and run the container
        uses: appleboy/ssh-action@v1
        with:
         host: ${{ secrets.HOST }}
         username: ${{ secrets.SSH_USERNAME }}
         key: ${{ secrets.PRIVATE_KEY }}
         script: |
          docker rm -f portfolio-app || echo "Container not found, skipping removal."
          docker rmi -f ${{ secrets.DOCKER_USERNAME }}/portfolio-app || echo "Image not found, skipping removal."
          docker run -d -p 8080:80 --name portfolio-app ${{ secrets.DOCKER_USERNAME }}/portfolio-app:${{ github.run_number }}
    
 